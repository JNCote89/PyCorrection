[workspace]
authors = ["JNCote89 <Jean-Nicolas.Cote@USherbrooke.ca>"]
channels = ["conda-forge"]
name = "PyCorrection"
platforms = ["linux-64", "win-64"]
version = "0.1.0"


[dependencies]
python = "3.12.*" # Bugs with PySide6 Signals and Nuitka with version above 3.12
pyside6 = ">=6.11.2,<7"
openpyxl = ">=3.1.5,<4"
tomlkit = ">=0.15.0,<0.16"
pydantic = ">=2.13.4,<3"
sqlalchemy = ">=2.0.51,<3"
pixi-pycharm = ">=0.0.11,<0.0.12"
habanero = ">=2.9.2,<3"
pypdf = ">=6.17.0,<7"
bs4 = ">=4.15.0,<5"
requests = ">=2.34.2,<3"
platformdirs = ">=4.11.6,<5"
httpx = ">=0.28.1,<0.29"
nuitka = ">=4.2.2,<5"

# All scientific libraries must be imported with pypi wheels to avoid Nuitka compiled bugs on Windows
[pypi-dependencies]
pyqtdarktheme = ">=2.1.0, <3"
pdftitle = ">=0.20, <0.21"
pypandoc-binary = ">=1.17, <2" # Critical for Nuitka to be imported with pypi wheels and binaries
zstandard = ">=0.25.0, <0.26"
numpy = ">=2.5.3, <3" # Critical for Nuitka to be imported with pypi wheels
pandas = ">=3.0.6, <4" # Critical for Nuitka to be imported with pypi wheels
matplotlib = ">=3.11.2, <4" # Critical for Nuitka to be imported with pypi wheels
imageio = ">=2.38.0, <3"
rapidfuzz = ">=3.14.6, <4"
contourpy = ">=1.4.0, <2" # Critical for Nuitka to be imported with pypi wheels
kiwisolver = ">=1.5.1, <2" # Critical for Nuitka to be imported with pypi wheels

[target.linux-64.dependencies]
xorg-libx11 = ">=1.8.13,<2"
fontconfig = ">=2.18.3,<3"

[feature.build.dependencies]
nuitka = ">=4.2.2,<5"
ccache = "*"

[feature.build.pypi-dependencies]
zstandard = "*"

[feature.build.target.linux-64.dependencies]
patchelf = "*"

[environments]
default = []
build = ["build"]

[tasks]
compile = "python build.py"
