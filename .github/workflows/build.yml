name: Build Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]  # Triggers release job when pushing version tags
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  # ---------------------------------------------------------------------------
  # 1. Linux Build Job
  # ---------------------------------------------------------------------------
  build-linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux' || github.event_name != 'workflow_dispatch'
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
      - name: Install baseline tools inside container
        run: |
          apt-get update
          apt-get install -y git curl sudo build-essential binutils libfuse2 file zlib1g-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "latest"
          run-install: true
          environments: build

      - name: Install Linux build dependencies (X11 / OpenGL for PySide6)
        run: |
          apt-get update
          apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx libegl1-mesa

      - name: Compile AppImage via Pixi
        run: pixi run -e build compile
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "yes"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Verify build output
        shell: bash
        run: |
          echo "Listing generated distribution files:"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCorrection-Linux
          path: dist/PyCorrection-Linux-x86_64.AppImage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Windows Build Job
  # ---------------------------------------------------------------------------
  build-windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows' || github.event_name != 'workflow_dispatch'
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "latest"
          run-install: true
          environments: build


      - name: Compile Executable via Pixi
        run: pixi run -e build compile
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "yes"

      - name: Verify build output
        shell: bash
        run: |
          echo "Listing generated distribution files:"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCorrection-Windows
          path: dist/PyCorrection-Windows-x64.exe
          retention-days: 7